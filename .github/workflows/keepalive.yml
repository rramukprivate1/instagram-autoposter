name: Keepalive
on:
  schedule:
    - cron: '0 0 1 * *'   # once a month, keeps it well under the 60-day disable window
  workflow_dispatch: {}

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update timestamp
        run: |
          mkdir -p .github
          date -u > .github/.keepalive
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/.keepalive
          git diff --cached --quiet || git commit -m "chore: keepalive commit"
          git push

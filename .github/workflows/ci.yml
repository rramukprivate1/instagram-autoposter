name: CI – Lint & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-python:
    runs-on: ubuntu-latest
    name: Lint Python Engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install linter
        run: pip install flake8
      - name: Lint engine/
        run: flake8 engine/ --max-line-length=120 --ignore=E302,W503

  lint-frontend:
    runs-on: ubuntu-latest
    name: Lint Admin PWA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: admin-panel
        run: npm ci
      - name: Lint
        working-directory: admin-panel
        run: npm run lint

  build-frontend:
    runs-on: ubuntu-latest
    name: Build Admin PWA
    needs: lint-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: admin-panel
        run: npm ci
      - name: Build
        working-directory: admin-panel
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: npm run build
